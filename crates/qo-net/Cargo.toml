[package]
name = "qo-net"
description = "Qwenodyssey 2.0 network + knowledge layer: web search/fetch, GitHub, MCP client, knowledge vault, sessions, evolution, compactor."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
qo-core = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
urlencoding = { workspace = true }
base64 = { workspace = true }
which = { workspace = true }
url = "2"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }

# The MCP integration test re-executes its own binary as the mock stdio MCP
# server (`--mock-mcp-server`), so it owns `main` instead of using libtest.
[[test]]
name = "mcp"
harness = false
